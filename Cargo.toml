[workspace]
resolver = "3"
members = ["crates/*"]
# Keeps `cargo run -- <cmd>` on the CLI now that ff-gui adds a second binary.
default-members = ["crates/ff-cli"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
ff-core = { path = "crates/ff-core" }
ff-io = { path = "crates/ff-io" }
ff-surgery = { path = "crates/ff-surgery" }
ff-preflight = { path = "crates/ff-preflight" }
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.37", features = ["persistence"] }
fluent-bundle = "0.16"
rfd = "0.17"
sys-locale = "0.3"
sysinfo = { version = "=0.39.6", default-features = false, features = ["system", "disk"] }
ttf-parser = "0.25"
unic-langid = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
